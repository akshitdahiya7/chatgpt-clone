# Deployment compose file for EC2: pulls prebuilt images from ECR rather than
# building on the instance, and puts Caddy in front for HTTPS.
#
#   export ECR_REGISTRY=<account>.dkr.ecr.us-east-1.amazonaws.com
#   export DOMAIN=yourname.duckdns.org
#   docker compose -f docker-compose.ec2.yml pull
#   docker compose -f docker-compose.ec2.yml up -d
#
# Only Caddy publishes ports. Everything else is reachable solely on the
# internal compose network.

services:

  ai-service:
    image: ${ECR_REGISTRY}/ai-service:latest
    env_file: ./ai-service/.env
    restart: unless-stopped

  chat-service:
    image: ${ECR_REGISTRY}/chat-service:latest
    env_file: ./chat-service/.env
    environment:
      AI_SERVICE_URL: http://ai-service:8002
    depends_on:
      - ai-service
    restart: unless-stopped

  gateway:
    image: ${ECR_REGISTRY}/gateway:latest
    env_file: ./gateway/.env
    environment:
      CHAT_SERVICE: http://chat-service:8001
    depends_on:
      - chat-service
    restart: unless-stopped

  frontend:
    image: ${ECR_REGISTRY}/frontend:latest
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means requesting them again,
      # and Let's Encrypt rate-limits that.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - chat-service
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
