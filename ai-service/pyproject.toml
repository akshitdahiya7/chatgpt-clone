[project]
name = "ai-service"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.139.0",
    "httpx>=0.28.1",
    "openai>=2.47.0",
    "opensearch-py>=3.2.0",
    "pydantic-settings>=2.14.2",
    "pymupdf>=1.28.0",
    "qdrant-client>=1.19.1",
]

[tool.fastapi]
entrypoint = "app.main:app"

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]
# Local embeddings, for running without an API key. Pulls in PyTorch (~2.5 GB),
# so it is deliberately kept out of the default install and the Docker image.
local = [
    "sentence-transformers>=5.6.0",
]
