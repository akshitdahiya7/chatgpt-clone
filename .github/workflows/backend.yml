name: CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "gateway/**"
      - "chat-service/**"
      - "ai-service/**"
      - "frontend/**"
      - ".github/workflows/backend.yml"

permissions:
  contents: read
  # Exporting build cache to the Actions cache needs write access.
  actions: write

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - gateway
          - chat-service
          - ai-service

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        working-directory: ${{ matrix.service }}
        run: uv sync

      - name: Lint
        working-directory: ${{ matrix.service }}
        run: uv run ruff check app/

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        # The default docker driver cannot export a build cache; the
        # docker-container driver this creates can.
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:latest
          # Cache layers in GitHub Actions so dependency installs are not
          # repeated on every run.
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Summary
        run: |
          echo "Pushed ${{ matrix.service }}:" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.ecr.outputs.registry }}/${{ matrix.service }}:latest\`" >> $GITHUB_STEP_SUMMARY

  build-and-push-frontend:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npx eslint app

      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: true
          # Empty means the app calls its own origin, which Caddy serves.
          build-args: |
            NEXT_PUBLIC_API_URL=
          tags: |
            ${{ steps.ecr.outputs.registry }}/frontend:${{ github.sha }}
            ${{ steps.ecr.outputs.registry }}/frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
